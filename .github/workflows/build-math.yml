name: Build Brain Training macOS DMG
on:
  push:
    paths:
      - 'MATH_TRAINER/**'
      - '.github/workflows/build-math.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Automatic question quality audit
        working-directory: MATH_TRAINER
        run: python3 qa/quality_check.py
      - name: Build Swift app
        working-directory: MATH_TRAINER
        run: swift build -c release
      - name: Create app icon, bundle and DMG
        working-directory: MATH_TRAINER
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.2.33"
          BUILD_DATE="$(date -u +'%d.%m.%Y')"
          APP_BUNDLE="Тренировка мозга.app"
          rm -rf "$APP_BUNDLE" "BrainTraining.dmg" "BrainTraining.iconset" "icon-1024.png"
          mkdir -p "$APP_BUNDLE/Contents/MacOS" "$APP_BUNDLE/Contents/Resources" "BrainTraining.iconset"
          # Educational geometry SVGs are downloaded from Wikimedia Commons and bundled offline.
          RES="$APP_BUNDLE/Contents/Resources"
          # Bundle the exact original medal illustrations downloaded from the user-provided PNG.
          for goal in 200 300 500 700 850 1000 1200 1500; do test -s "Assets/medal-$goal.png"; done
          cp Assets/medal-*.png "$RES/"
          download_geometry() {
            local name="$1"
            local url="$2"
            curl -fLsS --retry 2 --max-time 30 "$url" -o "$RES/$name.svg" || {
              echo "Warning: could not download $name; the app will use its native fallback symbol."
              rm -f "$RES/$name.svg"
            }
          }
          download_geometry "geometry-cylinder" "https://commons.wikimedia.org/wiki/Special:FilePath/Cylinder_geometry.svg"
          download_geometry "geometry-octahedron" "https://commons.wikimedia.org/wiki/Special:FilePath/Octahedron.svg"
          download_geometry "geometry-tetrahedron" "https://commons.wikimedia.org/wiki/Special:FilePath/Basic_tetrahedron.svg"
          download_geometry "geometry-cube" "https://commons.wikimedia.org/wiki/Special:FilePath/Wikijunior_cube.svg"
          download_geometry "geometry-cone" "https://commons.wikimedia.org/wiki/Special:FilePath/Cone%20(geometry).svg"
          download_geometry "geometry-sphere" "https://commons.wikimedia.org/wiki/Special:FilePath/Sphere.svg"
          download_geometry "geometry-square" "https://commons.wikimedia.org/wiki/Special:FilePath/Square.svg"
          download_geometry "geometry-triangle" "https://commons.wikimedia.org/wiki/Special:FilePath/Triangle.svg"
          download_geometry "geometry-rectangle" "https://commons.wikimedia.org/wiki/Special:FilePath/Rectangle.svg"
          download_geometry "geometry-trapezoid" "https://commons.wikimedia.org/wiki/Special:FilePath/Trapezoid.svg"
          download_geometry "geometry-circle" "https://commons.wikimedia.org/wiki/Special:FilePath/Circle.svg"
          download_geometry "geometry-line-segment" "https://commons.wikimedia.org/wiki/Special:FilePath/Line_segment.svg"
          download_geometry "geometry-perpendicular-lines" "https://commons.wikimedia.org/wiki/Special:FilePath/Perpendicular_lines.svg"
          download_geometry "geometry-parallel-lines" "https://commons.wikimedia.org/wiki/Special:FilePath/Parallel_lines.svg"
          cat > "$RES/geometry-sources.txt" <<'SOURCES'
          Геометрические SVG-иллюстрации скачиваются из Wikimedia Commons при сборке и включаются в DMG для офлайн-работы.
          geometry-cylinder.svg — Cylinder geometry.svg — public domain: https://commons.wikimedia.org/wiki/File:Cylinder_geometry.svg
          geometry-octahedron.svg — Octahedron.svg — CC BY-SA 3.0: https://commons.wikimedia.org/wiki/File:Octahedron.svg
          geometry-tetrahedron.svg — Basic tetrahedron.svg — CC0 1.0: https://commons.wikimedia.org/wiki/File:Basic_tetrahedron.svg
          geometry-cube.svg — Wikijunior cube.svg — public domain: https://commons.wikimedia.org/wiki/File:Wikijunior_cube.svg
          geometry-cone.svg — Cone (geometry).svg — CC BY-SA 3.0: https://commons.wikimedia.org/wiki/File:Cone_(geometry).svg
          geometry-sphere.svg — Sphere.svg — CC BY-SA 3.0: https://commons.wikimedia.org/wiki/File:Sphere.svg
          geometry-square.svg — Square.svg: https://commons.wikimedia.org/wiki/Special:FilePath/Square.svg
          geometry-triangle.svg — Triangle.svg: https://commons.wikimedia.org/wiki/Special:FilePath/Triangle.svg
          geometry-rectangle.svg — Rectangle.svg: https://commons.wikimedia.org/wiki/Special:FilePath/Rectangle.svg
          geometry-trapezoid.svg — Trapezoid.svg: https://commons.wikimedia.org/wiki/Special:FilePath/Trapezoid.svg
          geometry-circle.svg — Circle.svg: https://commons.wikimedia.org/wiki/Special:FilePath/Circle.svg
          geometry-line-segment.svg — Line_segment.svg: https://commons.wikimedia.org/wiki/Special:FilePath/Line_segment.svg
          geometry-perpendicular-lines.svg — Perpendicular_lines.svg: https://commons.wikimedia.org/wiki/Special:FilePath/Perpendicular_lines.svg
          geometry-parallel-lines.svg — Parallel_lines.svg: https://commons.wikimedia.org/wiki/Special:FilePath/Parallel_lines.svg
          SOURCES
          cp ".build/release/MathTrainer" "$APP_BUNDLE/Contents/MacOS/MathTrainer"
          chmod +x "$APP_BUNDLE/Contents/MacOS/MathTrainer"
          swift - <<'SWIFT'
          import AppKit
          import Foundation
          let image = NSImage(size: NSSize(width: 1024, height: 1024))
          image.lockFocus()
          let shape = NSBezierPath(roundedRect: NSRect(x: 34, y: 34, width: 956, height: 956), xRadius: 220, yRadius: 220)
          NSGradient(colors: [NSColor(calibratedRed: 0.36, green: 0.22, blue: 0.82, alpha: 1), NSColor(calibratedRed: 0.88, green: 0.34, blue: 0.68, alpha: 1)])!.draw(in: shape, angle: -42)
          func drawEmoji(_ value: String, size: CGFloat, at point: NSPoint) {
              let text = value as NSString
              let font = NSFont(name: "Apple Color Emoji", size: size) ?? NSFont.systemFont(ofSize: size)
              text.draw(at: point, withAttributes: [.font: font])
          }
          drawEmoji("🧠", size: 430, at: NSPoint(x: 240, y: 275))
          drawEmoji("✨", size: 140, at: NSPoint(x: 680, y: 690))
          drawEmoji("💎", size: 128, at: NSPoint(x: 700, y: 150))
          image.unlockFocus()
          guard let tiff = image.tiffRepresentation, let bitmap = NSBitmapImageRep(data: tiff), let png = bitmap.representation(using: .png, properties: [:]) else { fatalError("icon render failed") }
          try png.write(to: URL(fileURLWithPath: "icon-1024.png"))
          SWIFT
          sips -z 16 16 icon-1024.png --out BrainTraining.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 icon-1024.png --out BrainTraining.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 icon-1024.png --out BrainTraining.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 icon-1024.png --out BrainTraining.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 icon-1024.png --out BrainTraining.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 icon-1024.png --out BrainTraining.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 icon-1024.png --out BrainTraining.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 icon-1024.png --out BrainTraining.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 icon-1024.png --out BrainTraining.iconset/icon_512x512.png >/dev/null
          cp icon-1024.png BrainTraining.iconset/icon_512x512@2x.png
          iconutil -c icns BrainTraining.iconset -o "$APP_BUNDLE/Contents/Resources/AppIcon.icns"
          cat > "$APP_BUNDLE/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>CFBundleDisplayName</key><string>Тренировка мозга</string>
          <key>CFBundleExecutable</key><string>MathTrainer</string>
          <key>CFBundleIdentifier</key><string>ru.rustam.mathtrainer</string>
          <key>CFBundleName</key><string>Тренировка мозга</string>
          <key>CFBundleIconFile</key><string>AppIcon</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>${VERSION}</string>
          <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
          <key>AppReleaseDate</key><string>${BUILD_DATE}</string>
          <key>LSMinimumSystemVersion</key><string>14.0</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          codesign --force --deep --sign - "$APP_BUNDLE"
          hdiutil create -volname "Тренировка мозга" -srcfolder "$APP_BUNDLE" -ov -format UDZO "BrainTraining.dmg"
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: BrainTraining-macOS
          path: MATH_TRAINER/BrainTraining.dmg
          if-no-files-found: error
